services:
  # Database for user accounts, transactions, and history
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stock_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Message broker for Celery tasks
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Result backend and lock manager for Celery
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: stock-pred-backend:latest
    working_dir: /app/api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/stock_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app/api
    volumes:
      - ./api:/app/api
    depends_on:
      - db
      - rabbitmq
      - redis
    ports:
      - "8001:8000"

  celery-beat:
    image: stock-pred-backend:latest
    working_dir: /app/api
    command: celery -A worker.celery_app beat -l info
    volumes:
      - ./api:/app/api
    depends_on:
      - rabbitmq
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/stock_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app/api

  # High-priority worker for payment processing
  worker-payments:
    image: stock-pred-backend:latest
    working_dir: /app/api
    # Routes to 'payments' queue with higher concurrency
    command: celery -A worker.celery_app worker -Q payments -c 8 --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/stock_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app/api
    depends_on:
      - db
      - rabbitmq
      - redis
    volumes:
      - ./api:/app/api

  # Resource-heavy worker for ML predictions
  worker-ml:
    image: stock-pred-backend:latest
    working_dir: /app/api
    # Routes to 'ml' queue with concurrency limited to 2 to manage CPU/GPU usage
    command: celery -A worker.celery_app worker -Q ml -c 2 --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/stock_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app/api
    depends_on:
      - db
      - rabbitmq
      - redis
    volumes:
      - ./api:/app/api

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://localhost:8001
    ports:
      - "5174:80"
    depends_on:
      - api

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data: