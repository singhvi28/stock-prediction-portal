services:
  # 1. Database: PostgreSQL
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stock_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # 2. Broker: RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always

  # 3. Cache/Result Backend: Redis
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: always

  # 4. Main API (Builds the shared backend image)
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: stock-pred-backend:latest
    working_dir: /app/api
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/stock_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app/api
    volumes:
      - ./api:/app/api
    depends_on:
      - db
      - rabbitmq
      - redis
    ports:
      - "8001:8000"
    restart: always

  # 5. Celery Beat (Uses API image)
  celery-beat:
    image: stock-pred-backend:latest
    working_dir: /app/api
    command: celery -A worker.celery_app beat -l info
    volumes:
      - ./api:/app/api
    depends_on:
      - api
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/stock_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app/api
    restart: always

  # 6. Payment Worker (Uses API image)
  worker-payments:
    image: stock-pred-backend:latest
    working_dir: /app/api
    command: celery -A worker.celery_app worker -Q payments -c 2 --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/stock_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app/api
    depends_on:
      - api
    volumes:
      - ./api:/app/api
    restart: always

  # 7. ML Worker (Uses API image)
  worker-ml:
    image: stock-pred-backend:latest
    working_dir: /app/api
    command: celery -A worker.celery_app worker -Q ml -c 1 --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/stock_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app/api
    depends_on:
      - api
    volumes:
      - ./api:/app/api
    restart: always

  # 8. React Frontend (Standard Web Port 80)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # DIRECT IP SETUP (No Domain)
      - VITE_API_URL=http://13.233.172.46:8001
    ports:
      - "80:80"
    depends_on:
      - api
    restart: always

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

