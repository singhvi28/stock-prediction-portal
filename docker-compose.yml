services:
  # Database for user accounts, transactions, and history
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stock_db
    ports:
      - "5432:5432"

  # Message broker for Celery tasks
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  # Result backend and lock manager for Celery
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/stock_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - rabbitmq
      - redis
    ports:
      - "8000:8000"

  # High-priority worker for payment processing
  worker-payments:
    build:
      context: .
      dockerfile: api/Dockerfile
    # Routes to 'payments' queue with higher concurrency
    command: celery -A api.worker.celery_app worker -Q payments -c 8 --loglevel=info
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/stock_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - rabbitmq
      - redis

  # Resource-heavy worker for ML predictions
  worker-ml:
    build:
      context: .
      dockerfile: api/Dockerfile
    # Routes to 'ml' queue with concurrency limited to 2 to manage CPU/GPU usage
    command: celery -A api.worker.celery_app worker -Q ml -c 2 --loglevel=info
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/stock_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - rabbitmq
      - redis

  # Streamlit Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api